name: Test report (another model or firmware)
description: Tell us whether a KindleLab step worked on your Kindle. This is how the compatibility table grows.
title: "[test] <model> <firmware>: <step>"
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! **Before posting, remove serial numbers, MAC addresses, Wi-Fi names, e-mails and IP addresses (other than 192.168.15.244) from anything you paste.**
  - type: input
    id: model
    attributes:
      label: Kindle model
      description: e.g. Paperwhite 4 (10th gen). The "Device Info" screen or kindlemodding.org's models table helps.
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      description: Settings → Device Options → Device Info (e.g. 5.16.2.1.1)
    validations:
      required: true
  - type: input
    id: jailbreak
    attributes:
      label: Jailbreak method and hotfix version
      description: e.g. WinterBreak 1.7.0 + Universal Hotfix 2.3.2
  - type: dropdown
    id: step
    attributes:
      label: Which step or tool
      options:
        - KUAL + MRPI
        - OTA block (renameotabin)
        - USBNetwork / SSH over USB
        - usbnet-connect.sh
        - kindle-status.sh / kindle-screenshot.sh
        - KOReader install
        - build-koreader-config.py / SimpleUI
        - Home-screen tile (KOReader.sh)
        - full-backup.sh
        - pull-highlights.py
        - Other
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Worked as documented
        - Worked with changes (describe below)
        - Did not work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details and (redacted) output
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed serial numbers, MAC addresses, Wi-Fi names, e-mails and personal IPs.
          required: true
