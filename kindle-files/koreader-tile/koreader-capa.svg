<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <!-- KindleLab: original cover for the KOReader home-screen tile (grayscale, e-ink friendly). CC0. -->
  <rect width="600" height="800" fill="#141414"/>
  <rect x="26" y="26" width="548" height="748" rx="8" fill="none" stroke="#ececec" stroke-width="4"/>
  <rect x="40" y="40" width="520" height="720" rx="5" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>

  <text x="300" y="168" text-anchor="middle" font-family="Noto Serif" font-weight="700" font-size="88" fill="#f5f5f5">KOReader</text>
  <g fill="#bdbdbd"><rect x="215" y="196" width="170" height="2"/><circle cx="300" cy="197" r="5"/></g>

  <!-- rising sun behind an open book -->
  <g transform="translate(300,505)">
    <g stroke="#cfcfcf" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-200" x2="0" y2="-160"/>
      <line x1="-100" y1="-173" x2="-80" y2="-139"/><line x1="100" y1="-173" x2="80" y2="-139"/>
      <line x1="-173" y1="-100" x2="-139" y2="-80"/><line x1="173" y1="-100" x2="139" y2="-80"/>
    </g>
    <path d="M -120 -20 A 120 120 0 0 1 120 -20 Z" fill="#8c8c8c"/>
    <path d="M -86 -20 A 86 86 0 0 1 86 -20 Z" fill="#b8b8b8"/>
    <!-- pages -->
    <path d="M -8 -12 C -70 -52 -170 -52 -236 -28 L -236 128 C -170 104 -70 104 -8 144 Z" fill="#f5f5f5"/>
    <path d="M 8 -12 C 70 -52 170 -52 236 -28 L 236 128 C 170 104 70 104 8 144 Z" fill="#f5f5f5"/>
    <path d="M -8 -12 L -8 144 M 8 -12 L 8 144" stroke="#141414" stroke-width="3"/>
    <!-- lines of text -->
    <g stroke="#9a9a9a" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M -205 0 C -160 -14 -90 -14 -40 6"/><path d="M -205 28 C -160 14 -90 14 -40 34"/>
      <path d="M -205 56 C -160 42 -90 42 -40 62"/><path d="M -205 84 C -160 70 -110 70 -80 80"/>
      <path d="M 40 6 C 90 -14 160 -14 205 0"/><path d="M 40 34 C 90 14 160 14 205 28"/>
      <path d="M 40 62 C 90 42 160 42 205 56"/>
    </g>
    <!-- ribbon bookmark -->
    <path d="M 150 -34 L 150 108 L 166 92 L 182 108 L 182 -38 Z" fill="#5f5f5f"/>
  </g>

  <text x="300" y="712" text-anchor="middle" font-family="Noto Serif" font-style="italic" font-size="36" fill="#d6d6d6">minha biblioteca</text>
</svg>
